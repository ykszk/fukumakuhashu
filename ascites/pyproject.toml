[project]
name = "ascites-segmentation"
version = "0.1.0"
description = "Standalone nnU-Net v1 inference environment for ascites segmentation (Task505_TCGA-OV), no TensorFlow."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "nnunet==1.7.0",
    "batchgenerators==0.25.3",
    "acvl-utils==0.2",
    "SimpleITK==2.5.6",
    "nibabel==5.3.3",
    "numpy==1.23.5",
    "scipy==1.15.3",
    # nnunet==1.7.0 imports matplotlib (nnUNetTrainer.py) but doesn't declare it as
    # a dependency - add it explicitly or `import nnunet` fails at runtime.
    "matplotlib",
]
